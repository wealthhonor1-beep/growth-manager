<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>성장 관리</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f5f6fb; --card:#fff; --line:#e6e8f2;
  --txt:#111827; --muted:#6b7280; --soft:#f3f5ff;
  --weekend:#dedede; --today:#000;

  --doneBg: rgba(59,130,246,.14);
  --failBg: rgba(239,68,68,.14);

  --share1Bg: rgba(250,204,21,.18);
  --share2Bg: rgba(250,204,21,.06);

  --blue:#2563eb;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);
  font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR";
  color:var(--txt);
}
.wrap{max-width:1440px;margin:24px auto;padding:0 16px 60px}
.topbar{text-align:center;font-weight:900;font-size:16px;margin-bottom:10px}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:18px}
.cardHd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:900}
.cardBd{padding:18px}

/* ✅ 캘린더 모바일 가로스크롤용 */
.calScroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.calScroll::-webkit-scrollbar{height:10px}
.calScroll::-webkit-scrollbar-thumb{background:rgba(17,24,39,.12);border-radius:999px}
.calScroll::-webkit-scrollbar-track{background:transparent}

textarea{
  width:100%;border:1px solid var(--line);
  border-radius:14px;padding:12px;
  resize:none;overflow:hidden;
  line-height:1.6;
  min-height:calc(1.6em*6 + 24px);
}
textarea.bigTA{
  min-height:calc(1.6em*8 + 24px);
}

input{
  width:100%;border:1px solid var(--line);
  border-radius:14px;padding:12px;
}
button{
  border:1px solid var(--line);
  background:#fff;border-radius:10px;
  padding:8px 12px;font-weight:900;cursor:pointer;
}

.calTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:14px}
.dow{font-size:12px;color:var(--muted)}
.day{
  border:1px solid var(--line);
  border-radius:16px;
  padding:10px;
  min-height:180px;
  position:relative;
  cursor:pointer;
  background:#fff;
}
.day.other{opacity:.35}
.day.weekend{background:var(--weekend)}
.day.today{border:5px solid var(--today)}
.dayNum{position:absolute;top:8px;right:10px;font-size:12px;color:var(--muted)}

/* 목표 */
.goal{
  margin-top:6px;
  padding:6px 8px;
  border-radius:10px;
  font-size:13px;
  word-break:break-word;
  background:transparent;
  border:1px solid #000;
}
.goal.done{background:var(--doneBg)}
.goal.fail{background:var(--failBg)}
.goal.share1{background:var(--share1Bg)}
.goal.share2{background:var(--share2Bg)}

.empGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;transition:.25s}
.empGrid.focusA{grid-template-columns:2.6fr .5fr .5fr .5fr}
.empGrid.focusB{grid-template-columns:.5fr 2.6fr .5fr .5fr}
.empGrid.focusC{grid-template-columns:.5fr .5fr 2.6fr .5fr}
.empGrid.focusD{grid-template-columns:.5fr .5fr .5fr 2.6fr}

.emp{border:3px solid #000;border-radius:16px;background:#fff}
.empHd{padding:12px;border-bottom:1px solid var(--line);font-weight:900}
.empBd{padding:12px}
.label{font-weight:900;display:block;margin:10px 0 6px}
.hidden{display:none}

.warn span{
  display:inline-block;border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;margin-right:4px;
  cursor:pointer;
  user-select:none;
}
.warn span.active{
  background:#ff3b3b;color:#fff;border-color:#ff3b3b;
}

.nameGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* =========================
   MEMO (3 columns)
   ========================= */
.memoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.memoBox{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px}
.memoTitle{font-weight:900;margin-bottom:10px}
.memoInputRow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.memoInputRow input{flex:1}
.memoAddBtn{white-space:nowrap}
.memoList{display:flex;flex-direction:column;gap:8px}
.memoItem{
  background:var(--soft);
  border-radius:12px;
  padding:10px 10px;
  display:flex;
  align-items:center;
  gap:10px;
  position:relative;
  overflow:hidden;
}
.memoText{
  flex:1;
  font-size:13px;
  line-height:1.4;
  word-break:break-word;
}
.memoBtns{display:flex;gap:6px}
.mBtn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:6px 10px;
  font-weight:900;
  cursor:pointer;
  font-size:12px;
}
.mBtn.ok{border-color:rgba(37,99,235,.35)}
.mBtn.del{border-color:rgba(17,24,39,.2)}
.memoItem.done .memoText{opacity:.35}
.memoItem.done::after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  top:50%;
  height:2px;
  background:var(--blue);
  transform:translateY(-50%);
  opacity:.85;
}

/* =========================
   ✅ MOBILE RESPONSIVE
   ========================= */

/* 태블릿/모바일 */
@media (max-width: 980px){
  .wrap{margin:14px auto;padding:0 12px 48px}
  .card{border-radius:16px}
  .cardHd{padding:12px 14px}
  .cardBd{padding:14px}

  /* 메모 1열 */
  .memoGrid{grid-template-columns:1fr}

  /* 직원/이름 그리드 모바일 최적화 */
  .empGrid{grid-template-columns:1fr}
  .empGrid.focusA,.empGrid.focusB,.empGrid.focusC,.empGrid.focusD{grid-template-columns:1fr}
  .nameGrid{grid-template-columns:repeat(2,1fr)}
}

/* 아주 작은 폰(캘린더는 가로 스크롤로 유지) */
@media (max-width: 520px){
  .topbar{font-size:15px}
  button{padding:10px 12px} /* 터치영역 확대 */
  .calendar{gap:8px; min-width: 760px;} /* ✅ 7열 유지 + 가로스크롤 */
  .day{min-height:160px;border-radius:14px}
  .dow{font-size:11px}
  .goal{font-size:12.5px}
}
</style>
</head>

<body>
<div class="wrap">
  <div class="topbar">성장 관리</div>

  <div class="card">
    <div class="cardHd">
      <div class="calTop">
        <div>
          <button id="prev">◀</button>
          <button id="todayBtn">오늘</button>
          <button id="next">▶</button>
        </div>
        <div id="monthTitle"></div>
      </div>
    </div>
    <!-- ✅ calScroll 추가 (모바일에서 캘린더 가로스크롤) -->
    <div class="cardBd calScroll"><div class="calendar" id="calendar"></div></div>
  </div>

  <!-- ✅ 메모장 -->
  <div class="card">
    <div class="cardHd">메모장</div>
    <div class="cardBd">
      <div class="memoGrid" id="memoGrid"></div>
    </div>
  </div>

  <div class="card">
    <div class="cardHd">개인 관리</div>
    <div class="cardBd"><div class="empGrid" id="empGrid"></div></div>
  </div>

  <div class="card">
    <div class="cardHd">직원 이름 설정</div>
    <div class="cardBd"><div class="nameGrid" id="nameGrid"></div></div>
  </div>
</div>

<script>
const sb = supabase.createClient(
  "https://luuanpofbuptwtiwlhpx.supabase.co",
  "sb_publishable_Zs7mY_XmGC2a-leOy4tUYA_cDJeFZ_X"
);
const STATE_ID="00000000-0000-0000-0000-000000000001";

const PW={A:"gudwls184",B:"wjddnjs160",C:"eodufeogml",D:"dnpftmdhsj1"};
const emps=["A","B","C","D"];
let STATE=null;

/* 날짜 안정화(로컬 + 정오 고정) */
const atNoon = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
const mkNoon = (y,m,day) => new Date(y, m, day, 12, 0, 0);

const ymd = (d) => {
  const dd = atNoon(d);
  const y = dd.getFullYear();
  const m = String(dd.getMonth()+1).padStart(2,"0");
  const day = String(dd.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
};

const autoGrow=t=>{t.style.height="auto";t.style.height=t.scrollHeight+"px";};

function defaultData(){
  return{
    view:{y:new Date().getFullYear(),m:new Date().getMonth()},
    calendar:{},
    status:{done:[],fail:[]},
    emp:{
      A:{perfNext:"",routine:"",mistake:"",rule:"",warn:[]},
      B:{perfNext:"",routine:"",mistake:"",rule:"",warn:[]},
      C:{perfNext:"",routine:"",mistake:"",rule:"",warn:[]},
      D:{perfNext:"",routine:"",mistake:"",rule:"",warn:[]}
    },
    names:{A:"A 직원",B:"B 직원",C:"C 직원",D:"D 직원"},
    memo:{design:[], ops:[], reels:[]}
  };
}

async function init(){
  await sb.auth.signInAnonymously();
  const {data}=await sb.from("growth_state").select("data").eq("id",STATE_ID).single();
  if(!data){
    STATE=defaultData();
    await sb.from("growth_state").insert({id:STATE_ID,data:STATE});
  }else STATE=data.data;

  /* (기존 데이터 호환) goal.state/share 없으면 기본값 세팅 */
  Object.keys(STATE.calendar||{}).forEach(d=>{
    (STATE.calendar[d]||[]).forEach(g=>{
      if(!("state" in g)) g.state = "none"; // none | done | fail
      if(!("share" in g)) g.share = "none"; // none | share1 | share2
    });
  });

  /* (기존 데이터 호환) memo 없으면 추가 */
  if(!STATE.memo) STATE.memo = {design:[], ops:[], reels:[]};
  STATE.memo.design = Array.isArray(STATE.memo.design) ? STATE.memo.design : [];
  STATE.memo.ops    = Array.isArray(STATE.memo.ops) ? STATE.memo.ops : [];
  STATE.memo.reels  = Array.isArray(STATE.memo.reels) ? STATE.memo.reels : [];

  /* ✅ 앱 켤 때 무조건 '오늘(현재 연/월)'로 맞춤 */
  const n = new Date();
  STATE.view = { y: n.getFullYear(), m: n.getMonth() };
  await saveDB();

  renderAll();
}

async function saveDB(){
  await sb.from("growth_state").update({data:STATE}).eq("id",STATE_ID);
}

function renderAll(){
  renderCalendar();
  renderMemo();
  renderEmp();
  renderNames();
}

/* 유틸: status 배열에 중복 없이 upsert */
function upsertStatus(type, item){
  const arr = STATE.status[type];
  const idx = arr.findIndex(x => x.goalId === item.goalId && x.date === item.date);
  if(idx >= 0) arr[idx] = item;
  else arr.push(item);
}

/* 유틸: 목표 완전 삭제(달력/상태 모두에서 제거) */
function deleteGoalEverywhere(date, goalId){
  const arr = STATE.calendar[date] || [];
  const idx = arr.findIndex(x => x.id === goalId);
  if(idx >= 0) arr.splice(idx, 1);

  STATE.status.done = STATE.status.done.filter(x => !(x.goalId===goalId && x.date===date));
  STATE.status.fail = STATE.status.fail.filter(x => !(x.goalId===goalId && x.date===date));

  if(arr.length === 0) delete STATE.calendar[date];
}

/* CALENDAR */
function renderCalendar(){
  calendar.innerHTML="";

  monthTitle.textContent=`${STATE.view.y}년 ${STATE.view.m+1}월`;

  ["일","월","화","수","목","금","토"].forEach(d=>{
    const e=document.createElement("div");
    e.className="dow";e.textContent=d;calendar.appendChild(e);
  });

  const first = mkNoon(STATE.view.y, STATE.view.m, 1);
  const start = new Date(first);
  start.setDate(first.getDate() - first.getDay());
  start.setHours(12,0,0,0);

  const today = ymd(new Date());

  for(let i=0;i<42;i++){
    const cur = new Date(start);
    cur.setDate(start.getDate()+i);
    cur.setHours(12,0,0,0);
    const id = ymd(cur);

    const cell=document.createElement("div");
    cell.className="day";
    if(cur.getMonth()!=STATE.view.m)cell.classList.add("other");
    if([0,6].includes(cur.getDay()))cell.classList.add("weekend");
    if(id===today)cell.classList.add("today");
    cell.innerHTML=`<div class="dayNum">${cur.getDate()}</div>`;

    (STATE.calendar[id]||[]).forEach(g=>{
      const div=document.createElement("div");
      div.className="goal";

      const st = g.state || "none";
      if(st==="done") div.classList.add("done");
      if(st==="fail") div.classList.add("fail");

      const sh = g.share || "none";
      if(sh==="share1") div.classList.add("share1");
      if(sh==="share2") div.classList.add("share2");

      div.textContent=g.text;

      div.onclick=async e=>{
        e.stopPropagation();
        const c=prompt("1:이행 2:불이행 3:수정 4:삭제 5:전달 6:전달2","1");
        const arr=STATE.calendar[id];
        const idx=arr.findIndex(x=>x.id===g.id);
        if(idx<0) return;

        if(c==="1"||c==="2"){
          const newState = (c==="1") ? "done" : "fail";
          arr[idx].state = newState;

          const otherType = (newState==="done") ? "fail" : "done";
          STATE.status[otherType] = STATE.status[otherType].filter(x => !(x.goalId===g.id && x.date===id));

          upsertStatus(newState, {goalId:g.id, text:g.text, date:id});
        }

        if(c==="3"){
          const n=prompt("수정",g.text);
          if(n){
            arr[idx].text=n;
            ["done","fail"].forEach(t=>{
              const sIdx = STATE.status[t].findIndex(x=>x.goalId===g.id && x.date===id);
              if(sIdx>=0) STATE.status[t][sIdx].text = n;
            });
          }
        }

        if(c==="4"){
          deleteGoalEverywhere(id, g.id);
        }

        if(c==="5"){
          arr[idx].share = (arr[idx].share==="share1") ? "none" : "share1";
        }
        if(c==="6"){
          arr[idx].share = (arr[idx].share==="share2") ? "none" : "share2";
        }

        await saveDB();renderAll();
      };

      cell.appendChild(div);
    });

    cell.onclick=async()=>{
      const t=prompt("목표 입력");
      if(!t)return;
      STATE.calendar[id]=STATE.calendar[id]||[];
      STATE.calendar[id].push({id:Date.now(),text:t,state:"none",share:"none"});
      await saveDB();renderAll();
    };

    calendar.appendChild(cell);
  }
}

/* =========================
   MEMO
   ========================= */
const MEMO_CFG = [
  {key:"design", title:"디자인목표"},
  {key:"ops",    title:"운영-마케팅 목표"},
  {key:"reels",  title:"릴스-게시글 목표"},
];

function renderMemo(){
  memoGrid.innerHTML="";

  MEMO_CFG.forEach(cfg=>{
    const box=document.createElement("div");
    box.className="memoBox";

    const list = STATE.memo[cfg.key] || [];
    const canAdd = list.length < 10;

    box.innerHTML = `
      <div class="memoTitle">${cfg.title}</div>
      <div class="memoInputRow">
        <input type="text" placeholder="최대 10개까지 입력" ${canAdd ? "" : "disabled"}>
        <button class="memoAddBtn" ${canAdd ? "" : "disabled"}>추가</button>
      </div>
      <div class="memoList"></div>
    `;

    const input = box.querySelector("input");
    const addBtn = box.querySelector("button");
    const listEl = box.querySelector(".memoList");

    const addItem = async ()=>{
      const t = (input.value||"").trim();
      if(!t) return;
      const arr = STATE.memo[cfg.key] || (STATE.memo[cfg.key]=[]);
      if(arr.length >= 10){ alert("해당 칸은 최대 10개까지 가능합니다."); return; }
      arr.push({id: Date.now(), text: t, done:false});
      input.value="";
      await saveDB(); renderMemo();
    };

    addBtn.onclick = addItem;
    input.onkeydown = (e)=>{ if(e.key==="Enter"){ e.preventDefault(); addItem(); } };

    list.forEach(item=>{
      const row=document.createElement("div");
      row.className="memoItem" + (item.done ? " done" : "");
      row.innerHTML = `
        <div class="memoText"></div>
        <div class="memoBtns">
          <button class="mBtn ok">O</button>
          <button class="mBtn del">X</button>
        </div>
      `;
      row.querySelector(".memoText").textContent = item.text;

      row.querySelector(".ok").onclick = async ()=>{
        item.done = !item.done;
        await saveDB(); renderMemo();
      };

      row.querySelector(".del").onclick = async ()=>{
        STATE.memo[cfg.key] = (STATE.memo[cfg.key]||[]).filter(x => x.id !== item.id);
        await saveDB(); renderMemo();
      };

      listEl.appendChild(row);
    });

    memoGrid.appendChild(box);
  });
}

/* EMP */
function renderEmp(){
  empGrid.innerHTML="";empGrid.className="empGrid";
  emps.forEach(e=>{
    const emp=STATE.emp[e];
    const box=document.createElement("div");
    box.className="emp";
    box.innerHTML=`
      <div class="empHd">${STATE.names[e]}</div>
      <div class="empBd">
        <span class="label">성과 및 다음 목표</span>
        <textarea class="bigTA">${emp.perfNext}</textarea>
        <span class="label">기본 루틴</span>
        <textarea class="bigTA">${emp.routine}</textarea>
        <input type="password" placeholder="비밀번호">
        <div class="hidden">
          <span class="label">실수사례</span><textarea>${emp.mistake}</textarea>
          <span class="label">규칙</span><textarea>${emp.rule}</textarea>
          <span class="label">경고 점수</span>
          <div class="warn">${[0,1,2,3,4,5].map(n=>`<span>${n}</span>`).join("")}</div>
        </div>
      </div>`;

    const [perf,routine,pw,hidden]=box.querySelectorAll("textarea,input,.hidden");
    autoGrow(perf);autoGrow(routine);

    perf.oninput=async()=>{autoGrow(perf);emp.perfNext=perf.value;await saveDB();};
    routine.oninput=async()=>{autoGrow(routine);emp.routine=routine.value;await saveDB();};

    pw.oninput=()=>{
      if(pw.value===PW[e]){
        hidden.style.display="block";
        empGrid.className="empGrid focus"+e;
        const [mis,rule]=hidden.querySelectorAll("textarea");
        autoGrow(mis);autoGrow(rule);
        mis.oninput=async()=>{autoGrow(mis);emp.mistake=mis.value;await saveDB();};
        rule.oninput=async()=>{autoGrow(rule);emp.rule=rule.value;await saveDB();};
        hidden.querySelectorAll(".warn span").forEach(s=>{
          const n=+s.textContent;
          if(emp.warn.includes(n))s.classList.add("active");
          s.onclick=async()=>{
            emp.warn=emp.warn.includes(n)
              ? emp.warn.filter(x=>x!==n)
              : [...emp.warn,n].sort((a,b)=>a-b);
            s.classList.toggle("active");
            await saveDB();
          };
        });
      }else{
        hidden.style.display="none";
        empGrid.className="empGrid";
      }
    };
    empGrid.appendChild(box);
  });
}

/* NAMES */
function renderNames(){
  nameGrid.innerHTML="";
  emps.forEach(e=>{
    const i=document.createElement("input");
    i.value=STATE.names[e];
    i.oninput=async()=>{STATE.names[e]=i.value;await saveDB();renderEmp();};
    nameGrid.appendChild(i);
  });
}

/* NAV */
prev.onclick=async()=>{
  STATE.view.m--;
  if(STATE.view.m<0){STATE.view.m=11;STATE.view.y--}
  await saveDB();renderAll();
}
next.onclick=async()=>{
  STATE.view.m++;
  if(STATE.view.m>11){STATE.view.m=0;STATE.view.y++}
  await saveDB();renderAll();
}
todayBtn.onclick=async()=>{
  const n=new Date();
  STATE.view={y:n.getFullYear(),m:n.getMonth()};
  await saveDB();renderAll();
}

init();
</script>
</body>
</html>
